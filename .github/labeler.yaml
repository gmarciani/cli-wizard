Documentation:
  - changed-files:
      - any-glob-to-any-file:
        - docs/**
        - examples/**
        - CODE_OF_CONDUCT.md
        - CONTRIBUTING.md
        - DEVELOPMENT.md
        - LICENSE
        - NOTICE
        - README.md
Developer Experience:
  - changed-files:
      - any-glob-to-any-file:
        - .github/**
        - .gitignore
        - .pre-commit
# A Dependabot security update, which comes from a *-security group in
# .github/dependabot.yaml and is named after it.
Security:
  - head-branch:
      - '^dependabot/.+-security-'
