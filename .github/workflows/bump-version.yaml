name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The target version, X.Y.Z'
        required: true
        type: string
      branch:
        description: 'The branch to bump'
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Bump version
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/bump_version.py "$VERSION"

      - name: Check for changes
        id: changes
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if git diff --quiet; then
            message="No pull request will be created: $BRANCH is already at version $VERSION, with its section in CHANGELOG.md."
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ inputs.branch }}
          branch: chore/bump-version-${{ inputs.version }}
          delete-branch: true
          commit-message: 'chore(release): bump version to ${{ inputs.version }}'
          title: 'chore(release): bump version to ${{ inputs.version }}'
          body: |
            Bumps `VERSION` to ${{ inputs.version }} and opens its section in `CHANGELOG.md`.

            Close and reopen the pull request for the checks to run.

            Generated by the Bump Version workflow.
          labels: Skip Changelog Update
