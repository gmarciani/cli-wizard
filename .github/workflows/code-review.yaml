# Reviews every pull request with Claude Code and posts its findings as inline
# comments. The review is read-only: it never pushes, approves or blocks.
#
# Secrets are withheld from pull requests opened from forks, so those are
# skipped. Drafts are skipped until marked ready.
#
# Run by hand, it reviews the pull request whose link it is given, a draft or
# one from a fork included: only the default branch is checked out, and the
# change is read from GitHub. The action offers its inline comment tool on
# pull request events only, so a review started by hand posts its findings as
# one pull request comment.
#
# Requires the Claude GitHub App and the CLAUDE_CODE_OAUTH_TOKEN secret; see
# "Continuous AI" in DEVELOPMENT.md.
name: 🔍 Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pull-request:
        description: 'Link of the pull request to review'
        required: true
        type: string

concurrency:
  group: code-review-${{ github.event.pull_request.number || inputs.pull-request }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review the pull request
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Find the pull request
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ inputs.pull-request }}
        run: tools/code_review.py resolve --pull-request "$PULL_REQUEST"

      - name: Review the pull request given by its link
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}"
          claude_args: >-
            --allowedTools "Bash(gh pr comment:*)"
            --append-system-prompt "This review was started by hand, so the
            inline comment tool is not available. Where the review says to post
            inline comments, post every finding in one pull request comment
            with gh pr comment instead, naming the file and line of each."
