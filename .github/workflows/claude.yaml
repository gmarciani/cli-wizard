# Answers @claude mentions on issues and pull requests with Claude Code: it
# explains, reviews or implements what the comment asks, pushing a branch and
# opening a pull request when it changes code. Only users with write access
# trigger it; the action refuses everyone else.
#
# The toolchain is installed so Claude can run tox, pytest, ruff and mypy
# before it pushes.
#
# Requires the Claude GitHub App and the ANTHROPIC_API_KEY secret; see
# "Continuous AI" in DEVELOPMENT.md.
name: 🤖 Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 30
            --allowedTools "Bash(tox:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(cli-wizard:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
