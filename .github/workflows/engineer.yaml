# Implements the open issues labelled Planned, opening a draft pull request for
# each.
#
# Labelling an issue Planned approves its text: an issue whose title or body
# was edited after it was labelled is skipped until it is labelled again, and
# Claude reads the title and body only, never the comments, so nobody can
# steer it after a maintainer has approved the issue.
#
# Run by hand, it takes either the link of one issue to implement, retried
# even if it already had a pull request, or the most issues to take on; not
# both.
#
# Two jobs:
# - select picks the approved issues, oldest first, skipping those that
#   already had a pull request from their engineer/issue-<number> branch.
# - implement runs Claude Code on the issue's branch: it changes the code as
#   CLAUDE.md says, commits, pushes and opens a draft pull request. When it
#   opens none, the job explains why on the issue and removes Planned, so the
#   issue is not retried until it is labelled again.
#
# tools/engineer.py holds the logic of the steps around Claude, and runs by
# hand too.
#
# Claude pushes with the workflow's token, which cannot change workflow files
# and triggers no workflow, so the job starts the Test workflow on the branch;
# marking the pull request ready for review runs the other checks.
#
# Requires the Claude GitHub App and the CLAUDE_CODE_OAUTH_TOKEN secret; see
# "Continuous AI" in DEVELOPMENT.md.
name: 🛠️ Engineer

on:
  schedule:
    # Tuesdays at 9am Eastern, after the issues the Product Manager workflow
    # proposes on Friday have been triaged.
    - cron: '0 9 * * 2'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      issue:
        description: 'Link of the one issue to implement; not with max-issues'
        required: false
        type: string
      max-issues:
        description: 'Most issues to implement, 3 by default; not with issue'
        required: false
        type: string

concurrency:
  group: engineer
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issues: ${{ steps.select.outputs.issues }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select the approved Planned issues
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_LINK: ${{ inputs.issue }}
          MAX_ISSUES: ${{ inputs.max-issues }}
        run: >-
          tools/engineer.py select
          --repo "$GITHUB_REPOSITORY"
          --issue "$ISSUE_LINK"
          --max-issues "$MAX_ISSUES"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  implement:
    needs: select
    if: needs.select.outputs.issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ matrix.issue }}
      BRANCH: engineer/issue-${{ matrix.issue }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Read the issue
        id: issue
        run: >-
          tools/engineer.py read
          --repo "$GITHUB_REPOSITORY"
          --number "$ISSUE"
          --output claude-issue.md
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.issue.outputs.approved == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        if: steps.issue.outputs.approved == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Create the issue's branch
        if: steps.issue.outputs.approved == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Implement the issue
        id: claude
        if: steps.issue.outputs.approved == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement GitHub issue #${{ matrix.issue }} of this repository.
            Its title and body are in claude-issue.md: that is the whole
            specification. A maintainer approved it by labelling it Planned.

            Follow CLAUDE.md, which says how a change is made here and how
            its commit and pull request are written.

            You are on the branch ${{ env.BRANCH }}. Once the change is
            complete and its checks pass:

            1. Commit it as one commit, whose message ends with
               `Closes #${{ matrix.issue }}`.
            2. Push it with `git push --force origin ${{ env.BRANCH }}`: the
               branch is this workflow's own, and a retry replaces it.
            3. Open the pull request as a draft with `gh pr create --draft
               --base main --head ${{ env.BRANCH }}`, naming
               `Closes #${{ matrix.issue }}` among its references.

            Do not touch .github/workflows, which this workflow's token
            cannot push, or claude-issue.md.

            If the issue is unclear, contradicts the code or CLAUDE.md, or
            is too large for one pull request, change nothing, open no pull
            request, set implemented to false, and say why in reason, so a
            maintainer can clarify it.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Write,Edit,MultiEdit,Bash(cli-wizard:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(tox:*),Bash(ls:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*)"
            --json-schema '{
              "type": "object",
              "additionalProperties": false,
              "required": ["implemented", "reason"],
              "properties": {
                "implemented": {"type": "boolean"},
                "reason": {"type": "string"}
              }
            }'

      - name: Report the outcome
        if: always() && steps.issue.outputs.approved == 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          tools/engineer.py report
          --repo "$GITHUB_REPOSITORY"
          --number "$ISSUE"
          --branch "$BRANCH"
          --result "$RESULT"
          --claude-outcome "$CLAUDE_OUTCOME"
          --run-url "$RUN_URL"
          --summary "$GITHUB_STEP_SUMMARY"
