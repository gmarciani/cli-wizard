# Implements the open issues labelled Planned, opening a pull request for each.
#
# Labelling an issue Planned approves its text: an issue whose title or body
# was edited after it was labelled is skipped until it is labelled again, and
# Claude reads the title and body only, never the comments, so nobody can
# steer it after a maintainer has approved the issue.
#
# Two jobs:
# - select picks up to max-issues approved issues, oldest first, skipping
#   those that already had a pull request from their engineer/issue-<number>
#   branch. Run it for one issue to retry it whatever its pull requests.
# - implement runs Claude Code on the issue's branch: it changes the code as
#   CLAUDE.md says, commits, pushes and opens a draft pull request. When it
#   opens none, the job explains why on the issue and removes Planned, so the
#   issue is not retried until it is labelled again.
#
# Claude pushes with the workflow's token, which cannot change workflow files
# and triggers no workflow, so the job starts the Test workflow on the branch;
# marking the pull request ready for review runs the other checks.
#
# Requires the Claude GitHub App and the CLAUDE_CODE_OAUTH_TOKEN secret; see
# "Continuous AI" in DEVELOPMENT.md.
name: 🛠️ Engineer

on:
  schedule:
    # Tuesdays at 9am Eastern, after the issues the Product Manager workflow
    # proposes on Friday have been triaged.
    - cron: '0 9 * * 2'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      issue:
        description: 'One issue to implement, retried even if it already had a pull request'
        required: false
        type: string
      max-issues:
        description: 'Most issues to implement in this run'
        required: false
        default: '3'
        type: string

concurrency:
  group: engineer
  cancel-in-progress: false

env:
  # The issue as of now: its text, its labels, and when its text last changed
  # and when it was labelled Planned.
  ISSUE_QUERY: >-
    query($owner: String!, $repo: String!, $number: Int!) {
      repository(owner: $owner, name: $repo) {
        issue(number: $number) {
          number title body state lastEditedAt
          labels(first: 50) { nodes { name } }
          timelineItems(last: 100, itemTypes: [LABELED_EVENT, RENAMED_TITLE_EVENT]) {
            nodes {
              __typename
              ... on LabeledEvent { createdAt label { name } }
              ... on RenamedTitleEvent { createdAt }
            }
          }
        }
      }
    }
  # true when the issue is open, labelled Planned, and its title and body have
  # not changed since it was last labelled Planned.
  APPROVED_FILTER: >-
    (.state == "OPEN")
    and (.labels.nodes | map(.name) | index("Planned") != null)
    and (
      ([.timelineItems.nodes[] | select(.__typename == "LabeledEvent" and .label.name == "Planned") | .createdAt] | max) as $planned
      | ([.lastEditedAt] + [.timelineItems.nodes[] | select(.__typename == "RenamedTitleEvent") | .createdAt] | map(select(. != null)) | max) as $edited
      | $planned != null and ($edited == null or $edited <= $planned)
    )

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      issues: ${{ steps.select.outputs.issues }}
    steps:
      - name: Select the approved Planned issues
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONE_ISSUE: ${{ inputs.issue }}
          MAX_ISSUES: ${{ inputs.max-issues || '3' }}
        run: |
          if [ -n "$ONE_ISSUE" ]; then
            candidates="${ONE_ISSUE#\#}"
          else
            candidates="$(gh issue list --repo "$GITHUB_REPOSITORY" --label Planned --state open \
              --limit 200 --json number --jq 'map(.number) | sort | .[]')"
          fi

          selected=()
          for number in $candidates; do
            [ "${#selected[@]}" -ge "$MAX_ISSUES" ] && break
            issue="$(gh api graphql -f query="$ISSUE_QUERY" -f owner="${GITHUB_REPOSITORY%/*}" \
              -f repo="${GITHUB_REPOSITORY#*/}" -F number="$number" --jq .data.repository.issue)"
            # An assignment, so a jq error fails the run instead of skipping the issue.
            approved="$(jq -r "$APPROVED_FILTER" <<< "$issue")"
            if [ "$approved" != true ]; then
              echo "::notice::Skipped #$number: not open and labelled Planned, or edited since it was labelled Planned."
              continue
            fi
            if [ -z "$ONE_ISSUE" ]; then
              pulls="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "engineer/issue-$number" \
                --state all --json number --jq length)"
              if [ "$pulls" != 0 ]; then
                echo "::notice::Skipped #$number: it already had a pull request; run the workflow for it to retry."
                continue
              fi
            fi
            selected+=("$number")
          done

          issues="$(printf '%s\n' "${selected[@]}" | jq -Rnc '[inputs | select(length > 0) | tonumber]')"
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "Issues to implement: $issues" >> "$GITHUB_STEP_SUMMARY"

  implement:
    needs: select
    if: needs.select.outputs.issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ matrix.issue }}
      BRANCH: engineer/issue-${{ matrix.issue }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Read the issue
        id: issue
        run: |
          issue="$(gh api graphql -f query="$ISSUE_QUERY" -f owner="${GITHUB_REPOSITORY%/*}" \
            -f repo="${GITHUB_REPOSITORY#*/}" -F number="$ISSUE" --jq .data.repository.issue)"
          approved="$(jq -r "$APPROVED_FILTER" <<< "$issue")"
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          if [ "$approved" != true ]; then
            echo "::notice::Skipped #$ISSUE: it changed after it was selected."
            exit 0
          fi
          # The title and body as approved, read once here so the text Claude
          # reads is the text that was checked. Git ignores the file.
          jq -r '"# \(.title)\n\n\(.body)"' <<< "$issue" > claude-issue.md
          echo claude-issue.md >> .git/info/exclude

      - name: Set up Python
        if: steps.issue.outputs.approved == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        if: steps.issue.outputs.approved == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Create the issue's branch
        if: steps.issue.outputs.approved == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Implement the issue
        id: claude
        if: steps.issue.outputs.approved == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement GitHub issue #${{ matrix.issue }} of this repository.
            Its title and body are in claude-issue.md: that is the whole
            specification. A maintainer approved it by labelling it Planned.

            Follow CLAUDE.md, which says how a change is made here and how
            its commit and pull request are written.

            You are on the branch ${{ env.BRANCH }}. Once the change is
            complete and its checks pass:

            1. Commit it as one commit, whose message ends with
               `Closes #${{ matrix.issue }}`.
            2. Push it with `git push --force origin ${{ env.BRANCH }}`: the
               branch is this workflow's own, and a retry replaces it.
            3. Open the pull request as a draft with `gh pr create --draft
               --base main --head ${{ env.BRANCH }}`, naming
               `Closes #${{ matrix.issue }}` among its references.

            Do not touch .github/workflows, which this workflow's token
            cannot push, or claude-issue.md.

            If the issue is unclear, contradicts the code or CLAUDE.md, or
            is too large for one pull request, change nothing, open no pull
            request, set implemented to false, and say why in reason, so a
            maintainer can clarify it.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Write,Edit,MultiEdit,Bash(cli-wizard:*),Bash(pytest:*),Bash(ruff:*),Bash(mypy:*),Bash(tox:*),Bash(ls:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*)"
            --json-schema '{
              "type": "object",
              "additionalProperties": false,
              "required": ["implemented", "reason"],
              "properties": {
                "implemented": {"type": "boolean"},
                "reason": {"type": "string"}
              }
            }'

      - name: Report the outcome
        if: always() && steps.issue.outputs.approved == 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          url="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json url --jq '.[0].url // empty')"
          if [ -n "$url" ]; then
            gh workflow run test.yaml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
            echo "Opened $url for #$ISSUE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          reason="$(jq -r '.reason // empty' <<< "${RESULT:-null}" 2>/dev/null || true)"
          [ -n "$reason" ] || reason="Claude Code did not finish ($CLAUDE_OUTCOME); see the workflow run."
          {
            echo "The [Engineer]($RUN_URL) workflow did not open a pull request for this issue."
            echo
            echo "$reason"
            echo
            echo "Clarify the issue if needed, then label it \`Planned\` again to retry."
          } > "$RUNNER_TEMP/issue-comment.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-comment.md"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label Planned
          echo "#$ISSUE: no pull request. $reason" >> "$GITHUB_STEP_SUMMARY"
