name: Draft Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          message="$(tools/draft_release.sh)"
          echo "::notice::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
