[tox]
envlist = py312,py313,py314,lint,type,coverage

# Versions live in [dependency-groups] in pyproject.toml only; `dependency_groups`
# reads them from there. The test environments install only the `test` group,
# as in the generated tox.ini; unlike the generated group, it also holds mypy
# and the stubs, since the suite type checks the code it generates.
# py3xx environments pick their interpreter from their name. Every other
# environment declares base_python = py314, the default interpreter, which
# pyenv resolves to the release pinned in the Makefile.
[testenv]
dependency_groups = test
commands = pytest tests/ -v

[testenv:test]
base_python = py314
commands = pytest tests/ -v --cov=cli_wizard --cov-report=term-missing

[testenv:lint]
base_python = py314
commands =
    ruff check src/cli_wizard tools/ tests/
    ruff format --check src/cli_wizard tools/ tests/

[testenv:type]
base_python = py314
dependency_groups = dev
commands = mypy src/cli_wizard tools/

[testenv:format]
base_python = py314
commands =
    ruff check --fix src/cli_wizard tools/ tests/
    ruff format src/cli_wizard tools/ tests/

[testenv:coverage]
base_python = py314
commands = pytest tests/ -v --cov=cli_wizard --cov-report=html --cov-report=term-missing
