[tox]
envlist = py312,py313,py314,lint,type,coverage

# Versions live in [dependency-groups] in pyproject.toml only; `dependency_groups`
# reads them from there.
[testenv]
dependency_groups = dev
commands = pytest tests/ -v

[testenv:test]
commands = pytest tests/ -v --cov=cli_wizard --cov-report=term-missing

[testenv:lint]
commands =
    ruff check src/cli_wizard tests/
    ruff format --check src/cli_wizard tests/

[testenv:type]
commands = mypy src/cli_wizard

[testenv:format]
commands =
    ruff check --fix src/cli_wizard tests/
    ruff format src/cli_wizard tests/

[testenv:coverage]
commands = pytest tests/ -v --cov=cli_wizard --cov-report=html --cov-report=term-missing
