[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-wizard"
dynamic = ["version"]
description = "Generate modern CLIs from OpenAPI specifications"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Giacomo Marciani", email = "giacomo.marciani@gmail.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
    "click~=8.4",
    "Jinja2~=3.1",
    "pydantic~=2.13",
    "PyYAML~=6.0",
    "requests~=2.34",
    "ruff~=0.16.2",
]

[project.scripts]
cli-wizard = "cli_wizard.cli:main"

[project.urls]
Homepage = "https://gmarciani.github.io/cli-wizard/"
Repository = "https://github.com/gmarciani/cli-wizard"
Issues = "https://github.com/gmarciani/cli-wizard/issues"

# Local-only tooling (PEP 735). Groups are never published, so none of this
# reaches anyone installing cli-wizard from an index. There are no extras: the
# built distributions carry no tests, so a published test extra would only
# install pytest for a consumer with nothing to run it against.
[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "build~=1.5",
    "mypy~=2.3",
    "pre-commit~=4.6",
    "tox~=4.58",
    "twine>=6.2,<8.0",
    "types-PyYAML~=6.0",
    "types-requests~=2.33",
]
test = [
    "pytest~=9.1",
    "pytest-cov~=7.1",
]
docs = [
    "sphinx~=9.1",
    "sphinx-click~=6.2",
    "sphinx-rtd-theme~=3.1",
    "sphinx-new-tab-link~=0.8",
    "autodoc_pydantic~=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli_wizard*"]

[tool.setuptools.package-data]
cli_wizard = [
    "templates/**/*.j2",
    "templates/**/*.yaml",
    "templates/**/*.yml",
    "templates/**/*.md",
    "config/*.yaml",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
omit = ["*/__init__.py"]
