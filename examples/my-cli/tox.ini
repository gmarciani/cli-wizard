[tox]
envlist = py312,py313,py314
isolated_build = True

# Versions live in [dependency-groups] in pyproject.toml only; `dependency_groups`
# reads them from there.
[testenv]
dependency_groups = test
commands =
    pytest tests/ -v --cov=my_cli --cov-report=term

[testenv:lint]
dependency_groups = dev
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/
    mypy src/

[testenv:format]
dependency_groups = dev
commands =
    ruff check --fix src/ tests/
    ruff format src/ tests/
