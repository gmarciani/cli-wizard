repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # The same files `tox -e type` checks.
        files: ^src/
        # pre-commit runs mypy in an isolated environment holding nothing but
        # mypy and the packages below. A package missing from it is untyped,
        # so mypy reports it as missing and reads everything from it as Any,
        # failing warn_return_any. The list is the runtime dependencies, with
        # the pins in pyproject.toml: click carries its own type hints, while
        # PyYAML and requests ship none, so their stubs come too.
        additional_dependencies:
          - click~=8.4
          - PyYAML~=6.0
          - requests~=2.34
          - types-PyYAML~=6.0
          - types-requests~=2.33
