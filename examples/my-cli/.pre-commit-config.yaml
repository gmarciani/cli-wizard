repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs in the `tox -e type` environment, which installs the project
  # with the dependencies pyproject.toml declares and the stubs in its dev
  # group, so nothing here has to repeat them. A mirrors-mypy hook would run
  # in an environment of its own, where every package left out of it is
  # untyped and fails the check.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: python
        additional_dependencies: [tox~=4.58]
        entry: tox -e type
        files: ^src/
        pass_filenames: false
